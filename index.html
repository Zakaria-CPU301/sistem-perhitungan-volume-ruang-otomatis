<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kalkulator Volume</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2f7, #dbe6f6);
        margin: 0;
      }

      /* WRAPPER YANG DI-CENTER */
      .wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* TITLE */
      h2 {
        text-align: center;
        font-weight: 600;
        color: #2c3e50;
      }

      /* CONTAINER */
      .container {
        display: flex;
        flex-direction: column;
        gap: 30px;
        max-width: 900px;
        margin: auto;
        padding: 0 20px;
      }

      /* CARD */
      .card {
        background: white;
        border-radius: 20px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .card:hover {
        transform: translateY(-8px) scale(1.03);
      }

      /* IMAGE */
      .card img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin-bottom: 15px;
      }

      /* TEXT */
      .card h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #333;
      }

      /* MODAL */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }

      /* MODAL BOX */
      .modal-content {
        background: white;
        width: 90%;
        max-width: 420px;
        padding: 25px;
        border-radius: 18px;
        position: relative;
        animation: muncul 0.25s ease;
      }

      /* ANIMASI */
      @keyframes muncul {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* CLOSE */
      .close {
        position: absolute;
        right: 15px;
        top: 10px;
        font-size: 20px;
        cursor: pointer;
        color: #888;
      }

      /* INPUT */
      input {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-size: 14px;
      }

      /* BUTTON */
      button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 10px;
        border: none;
        background: #4caf50;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #43a047;
      }

      /* RESULT */
      .result {
        margin-top: 15px;
        background: #eef6ff;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        font-weight: bold;
        color: #2c3e50;
      }

      /* FORM GROUP */
      .form-group {
        display: flex;
        flex-direction: column;
        margin-top: 12px;
      }

      /* LABEL */
      .form-group label {
        font-size: 14px;
        margin-bottom: 5px;
        color: #555;
        font-weight: 500;
      }

      /* INPUT */
      .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <h2 style="text-align: center">Pilih Bangun Ruang</h2>
        <div style="display: flex; gap: 20px">
          <div class="card" onclick="openModal(1)">
            <img src="pic/limas_segiempat.png" />
            <h3>Balok + Limas</h3>
          </div>
          <div class="card" onclick="openModal(3)">
            <img src="pic/prisma_segitiga.png" />
            <h3>Prisma</h3>
          </div>
          <div class="card" onclick="openModal(2)">
            <img src="pic/tabung_kerucut.png" />
            <h3>Tabung + Kerucut</h3>
          </div>
        </div>
      </div>
      <!-- MODAL -->
      <div class="modal" id="modal">
        <div class="modal-content">
          <span class="close" onclick="closeModal()">✖</span>
          <h3 id="judul"></h3>
          <div id="form"></div>
          <button onclick="hitung()">Hitung</button>
          <div class="result" id="hasil">Hasil: -</div>
        </div>
      </div>
    </div>

    <script>
      let currentShape = 0;

      function openModal(type) {
        currentShape = type;
        document.getElementById("modal").style.display = "flex";

        let form = "";
        let judul = "";

        if (type === 1) {
          judul = "Balok + Limas";
          form = `
            <div class="form-group">
                <label>Panjang (m)</label>
                <input id="p" type="number">
            </div>

            <div class="form-group">
                <label>Lebar (m)</label>
                <input id="l" type="number">
            </div>

            <div class="form-group">
                <label>Tinggi Balok (m)</label>
                <input id="t1" type="number">
            </div>

            <div class="form-group">
                <label>Tinggi Limas (m)</label>
                <input id="t2" type="number">
            </div>
            `;
        }

        if (type === 2) {
          judul = "Tabung + Kerucut";
          form = `
            <div class="form-group">
                <label>Jari-jari (m)</label>
                <input id="r" type="number">
            </div>

            <div class="form-group">
                <label>Tinggi Tabung (m)</label>
                <input id="t1" type="number">
            </div>

            <div class="form-group">
                <label>Tinggi Kerucut (m)</label>
                <input id="t2" type="number">
            </div>
            `;
        }

        if (type === 3) {
          judul = "Prisma";
          form = `
            <div class="form-group">
                <label>Luas Alas (m²)</label>
                <input id="luas" type="number">
            </div>

            <div class="form-group">
                <label>Tinggi (m)</label>
                <input id="t" type="number">
            </div>
            `;
        }

        document.getElementById("judul").innerText = judul;
        document.getElementById("form").innerHTML = form;
      }

      function closeModal() {
        document.getElementById("modal").style.display = "none";
        document.getElementById("hasil").innerText = "Hasil: -";
      }

      function hitung() {
        let hasil = 0;

        if (currentShape === 1) {
          let p = +document.getElementById("p").value;
          let l = +document.getElementById("l").value;
          let t1 = +document.getElementById("t1").value;
          let t2 = +document.getElementById("t2").value;

          hasil = p * l * t1 + (1 / 3) * p * l * t2;
        }

        if (currentShape === 2) {
          let r = +document.getElementById("r").value;
          let t1 = +document.getElementById("t1").value;
          let t2 = +document.getElementById("t2").value;

          hasil = Math.PI * r * r * t1 + (1 / 3) * Math.PI * r * r * t2;
        }

        if (currentShape === 3) {
          let luas = +document.getElementById("luas").value;
          let t = +document.getElementById("t").value;

          hasil = luas * t;
        }

        document.getElementById("hasil").innerText =
          "Hasil: " + hasil.toFixed(2) + " m³";
      }

      /* close klik luar */
      window.onclick = function (e) {
        if (e.target.id === "modal") {
          closeModal();
        }
      };
    </script>
  </body>
</html>
