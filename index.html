<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kalkulator Volume</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <h2 style="text-align: center">Pilih Bangun Ruang</h2>
        <div style="display: flex; gap: 20px">
          <div class="card" onclick="openModal(1)">
            <img src="pic/limas_segiempat.png" />
            <h3>Balok + Limas</h3>
          </div>
          <div class="card" onclick="openModal(3)">
            <img src="pic/prisma_segitiga.png" />
            <h3>Prisma</h3>
          </div>
          <div class="card" onclick="openModal(2)">
            <img src="pic/tabung_kerucut.png" />
            <h3>Tabung + Kerucut</h3>
          </div>
        </div>
      </div>
      <!-- MODAL -->
      <div class="modal" id="modal">
        <div class="modal-content">
          <span class="close" onclick="closeModal()">✖</span>
          <h3 id="judul"></h3>
          <div id="form"></div>
          <button onclick="hitung()">Hitung</button>
          <div class="result" id="hasil">Hasil: -</div>
        </div>
      </div>
    </div>
  </body>
</html>
